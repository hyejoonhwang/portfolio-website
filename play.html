    <style>
        /* ═══ PROJECT GRID ═══ */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
            padding: var(--gap);
        }

        .project-card {
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 20px 24px;
            transition: opacity 0.4s ease;
        }

        .project-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(255,255,255,0.85), transparent);
            pointer-events: none;
            border-radius: 0 0 4px 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .project-card:hover::after {
            opacity: 1;
        }

        .project-card-info {
            position: relative;
            z-index: 1;
        }

        .project-card:hover { opacity: 0.88; }

        .project-card-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            opacity: 0;
            transform: translateY(5px);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .project-card:hover .project-card-info {
            opacity: 1;
            transform: translateY(0);
        }

        .project-card-title {
            font-family: 'LT Cushion', 'General Sans', sans-serif;
            font-weight: 400;
            font-size: 1.105rem;
            letter-spacing: 0.01em;
        }

        .project-placeholder {
            background: #F5F4F2;
            aspect-ratio: 16 / 9;
        }

        /* Card backgrounds */
        .card-sage {
            background: none;
        }

        .project-card video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Gutsy card: small centered phone on accent background */
        .card-gutsy { background: #EF7ED8; container-type: inline-size; }
        .card-gutsy video {
            --r: clamp(10px, 5.5cqw, 24px);
            inset: auto;
            width: auto;
            height: 92%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            object-fit: contain;
            border-radius: var(--r);
            clip-path: inset(3px 5px 3px 3px round var(--r));
        }

        /* BeeBud card: the case-study hero (lilac stage, phone and floating components), full bleed */
        .card-beebud { background: #E6E2FF; }

        /* Talkspace card: hero walkthrough phone on Talkspace green, top of the phone showing like the case-study hero */
        .card-talkspace { background: #005C65; container-type: inline-size; }
        .card-talkspace picture { position: absolute; inset: 0; pointer-events: none; }
        .card-talkspace img {
            position: absolute;
            height: 138%;
            width: auto;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: clamp(10px, 5.5cqw, 24px) clamp(10px, 5.5cqw, 24px) 0 0;
        }

        /* Stagger animations */
        .project-grid > :nth-child(1) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.06s both; }
        .project-grid > :nth-child(2) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.10s both; }
        .project-grid > :nth-child(3) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.14s both; }
        .project-grid > :nth-child(4) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both; }
        .project-grid > :nth-child(5) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.22s both; }
        .project-grid > :nth-child(6) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.26s both; }
        .project-grid > :nth-child(7) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.30s both; }
        .project-grid > :nth-child(8) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.34s both; }
        .project-grid > :nth-child(9) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.38s both; }

        /* ═══ PLAY GRID: three interlocking columns, card height follows its thumbnail.
           Laptop mockups stay 16:9; ShyFaceTime, moss and the Music Chat crop absorb the difference
           so the outer columns (16/11 + 16/9) match the middle one (4/5). ═══ */
        .play-grid {
            display: flex;
            align-items: stretch;
        }

        .play-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: var(--gap);
        }

        .play-grid .project-card { aspect-ratio: var(--ar, 16 / 9); }

        /* The last card in each column stretches so all columns end level */
        .play-col > .project-card:last-child { flex: 1 0 auto; }

        .play-sf { --ar: 16 / 11; }   /* shyfacetime-wide.mp4: the square video padded to 16:11 in its own green, so the phone isn't cropped */
        .play-mc { --ar: 4 / 5; }
        .play-dy { --ar: 16 / 9; }
        .play-df { --ar: 16 / 9; }
        .play-tm { --ar: 16 / 11; }

        .play-col > :nth-child(1) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.06s both; }
        .play-col > :nth-child(2) { animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.14s both; }

        /* ═══ TABLET ═══ */
        @media (max-width: 900px) {
            .project-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Touch screens can't hover, so their titles stay visible */
        @media (hover: none) {
            .project-card-info {
                opacity: 1;
                transform: none;
            }
        }

        /* ═══ MOBILE ═══ */
        @media (max-width: 640px) {
            .project-grid {
                grid-template-columns: 1fr;
            }

            .play-grid { display: flex; flex-direction: column; gap: var(--gap); }
            .play-col { display: contents; }
            .play-col > .project-card:last-child { flex: none; }
            .play-sf { order: 1; }
            .play-mc { order: 2; }
            .play-dy { order: 3; }
            .play-df { order: 4; }
            .play-tm { order: 5; }
        }
    </style>
</head>
